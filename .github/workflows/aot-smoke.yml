name: AOT gallery smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  gallery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish the gallery with NativeAOT
        run: dotnet publish samples/PrestoGallery/PrestoGallery.Desktop -c Release -r win-x64 -p:PublishAot=true -o artifacts/gallery
      - name: Open every page
        run: samples/PrestoGallery/aot-smoke.ps1 artifacts/gallery/PrestoGallery.Desktop.exe
