name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and check without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  pack:
    needs: ci
    runs-on: windows-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - name: Pack
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet pack MonacoLabs.Presto -c Release -o artifacts/packages
          dotnet pack MonacoLabs.Presto.Avalonia -c Release -o artifacts/packages
          dotnet pack MonacoLabs.Presto.Avalonia.Lottie -c Release -o artifacts/packages
          dotnet pack MonacoLabs.Presto.Avalonia.DevTools -c Release -o artifacts/packages
      # The exact-pin check guards PinSiblingPackages, which hooks a NuGet-internal item.
      - name: Check the tag and sibling pins
        id: check
        run: |
          $failures = @()
          foreach ($package in Get-ChildItem artifacts/packages/*.nupkg) {
            $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $reader = [IO.StreamReader]::new(($zip.Entries | Where-Object FullName -like '*.nuspec').Open())
              [xml]$nuspec = $reader.ReadToEnd()
              $reader.Dispose()
            } finally { $zip.Dispose() }
            $version = $nuspec.package.metadata.version
            if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
              $failures += "$($package.Name): tag $env:GITHUB_REF_NAME does not match version $version"
            }
            foreach ($dependency in $nuspec.SelectNodes("//*[local-name()='dependency'][starts-with(@id, 'MonacoLabs.')]")) {
              if ($dependency.version -notmatch '^\[[^,]+\]$') {
                $failures += "$($package.Name): $($dependency.id) is $($dependency.version), not an exact [x] range"
              }
            }
          }
          if ($failures) { $failures | ForEach-Object { Write-Output "::error::$_" }; exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT
      # CI's prerelease packages already hold the name `packages` in this run.
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

  publish:
    needs: pack
    if: github.ref_type == 'tag' && !inputs.dry-run
    runs-on: windows-latest
    environment: nuget
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts/packages
      - name: Extract the release notes
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## |^\[[^\]]+\]:|\z)")
          if (-not $section.Success) { Write-Output "::error::CHANGELOG.md has no section for $env:VERSION"; exit 1 }
          $section.Groups[1].Value.Trim() | Set-Content release-notes.md
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER || github.repository_owner }}
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          $prerelease = @(if ($env:VERSION.Contains('-')) { '--prerelease' })
          gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes-file release-notes.md --verify-tag @prerelease

  # A release made with github.token raises no `release` event, so the samples are called, not triggered.
  samples:
    needs: publish
    uses: ./.github/workflows/samples.yml
    with:
      release-tag: ${{ github.ref_name }}
    permissions:
      contents: write
      pages: write
      id-token: write
