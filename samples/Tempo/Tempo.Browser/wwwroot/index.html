<!DOCTYPE html>
<html lang="en">

<head>
    <title>Tempo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./app.css" />
</head>

<body>
<div id="out">
    <div class="avalonia-splash">
        <svg width="240" height="240" viewBox="0 0 240 240" fill="none" aria-hidden="true">
            <circle cx="120" cy="120" r="116" stroke="#2C2F38" stroke-width="8"/>
            <circle class="splash-fill" cx="120" cy="120" r="116" stroke="#F2735E" stroke-width="8" stroke-linecap="round"
                    pathLength="240" transform="rotate(-90 120 120)"/>
        </svg>
        <div class="splash-wordmark"></div>
        <div class="splash-tagline"></div>
        <p class="splash-error" hidden></p>
    </div>
</div>
<script type='module' src="./main.js"></script>
</body>

</html>
